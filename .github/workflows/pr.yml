name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  pr:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2022]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node scripts/computeNodeModulesCacheKey.js)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: |
            **/node_modules
            **/.vscode-test
            **/.vscode-user-data-dir
            **/.vscode-ffmpeg
            **/.vscode-resolve-source-map-cache
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: Compute source maps cache key
        id: sourceMapsCacheKey
        run: echo "value=$(node packages/build/src/computeSourceMapsCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: source-maps-cache
        with:
          path: |
            **/.vscode-source-maps
            **/.vscode-sources
          key: ${{ runner.os }}-cacheSourceMaps-${{ steps.sourceMapsCacheKey.outputs.value }}
      - name: npm ci
        run: npm run install:ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      - run: npx lerna run test --since origin/main
      - name: Run headless test (with videos)
        if: matrix.os != 'macos-26'
        uses: coactions/setup-xvfb@v1
        with:
          run: node packages/cli/bin/test.js --cwd packages/e2e --record-video
      - name: Run headless test
        uses: coactions/setup-xvfb@v1
        with:
          run: npm run e2e
      - name: Run headless test (flakyness check)
        if: matrix.os != 'macos-26'
        uses: coactions/setup-xvfb@v1
        with:
          run: npm run e2e:check-flakyness
      - name: Run headless test (second flakyness check)
        if: matrix.os != 'macos-26'
        uses: coactions/setup-xvfb@v1
        with:
          run: npm run e2e:check-flakyness
      - name: Run headless test (check leaks, event listener count)
        if: matrix.os != 'macos-26'
        uses: coactions/setup-xvfb@v1
        with:
          run: node packages/cli/bin/test.js --cwd packages/e2e --check-leaks --measure-after
      - name: Run headless test (check leaks, event listeners)
        if: matrix.os == 'ubuntu-24.04'
        uses: coactions/setup-xvfb@v1
        with:
          run: node packages/cli/bin/test.js --cwd packages/e2e --check-leaks --measure event-listeners
      - name: Run Memory City smoke test
        if: matrix.os == 'ubuntu-24.04'
        run: timeout 5m xvfb-run --auto-servernum node packages/cli/bin/test.js --cwd packages/e2e --check-leaks --measure memory-city --only ^editor-open.ts --workers 1
      - name: Generate charts
        run: node packages/charts/src/main.ts
      - name: Validate Memory City artifact
        if: matrix.os == 'ubuntu-24.04'
        run: node packages/visualizations/src/validate.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vscode-videos-${{ runner.os }}
          path: ./.vscode-videos
          include-hidden-files: true

  pr-windows-poolmon:
    runs-on: windows-2022
    needs: pr
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node scripts/computeNodeModulesCacheKey.js)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: |
            **/node_modules
            **/.vscode-test
            **/.vscode-user-data-dir
            **/.vscode-ffmpeg
            **/.vscode-resolve-source-map-cache
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: Compute source maps cache key
        id: sourceMapsCacheKey
        run: echo "value=$(node packages/build/src/computeSourceMapsCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: source-maps-cache
        with:
          path: |
            **/.vscode-source-maps
            **/.vscode-sources
          key: ${{ runner.os }}-cacheSourceMaps-${{ steps.sourceMapsCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci --ignore-scripts && npm run postinstall
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm run build
      - name: Locate PoolMon
        shell: pwsh
        run: |
          $poolmon = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Tools" -Recurse -Filter poolmon.exe -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $poolmon) {
            $poolmon = Get-ChildItem "$env:ProgramFiles\Windows Kits\10\Tools" -Recurse -Filter poolmon.exe -File -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -eq $poolmon) {
            throw 'PoolMon was not found on the Windows runner. The WDK installation is missing.'
          }
          Write-Host "Using PoolMon at $($poolmon.FullName)"
          "POOLMON_PATH=$($poolmon.FullName)" >> $env:GITHUB_ENV
      - name: Run PoolMon measure
        continue-on-error: true
        run: node packages/cli/bin/test.js --cwd packages/e2e --check-leaks --measure-after --measure poolmon --runs 37 --run-skipped-tests-anyway
      - name: Generate PoolMon charts
        if: always()
        run: node packages/charts/src/main.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vscode-memory-leak-finder-results-windows-poolmon
          path: ./.vscode-memory-leak-finder-results
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vscode-memory-leak-finder-charts-windows-poolmon
          path: ./.vscode-charts
          include-hidden-files: true
