name: Large Performance Measure
run-name: Perf counter capability probe (x64 and ARM64)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install perf and allow performance counters
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic
          sudo apt-get install -y "linux-tools-$(uname -r)" || true
          sudo sysctl -w kernel.perf_event_paranoid=-1
      - name: Probe native instructions, cycles and software counters
        run: node scripts/probePerfCounters.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-capabilities-${{ matrix.runner }}
          path: perf-capabilities.json
          if-no-files-found: error
