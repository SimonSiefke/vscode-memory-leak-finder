name: Benchmark Reliability Validation
on: workflow_dispatch
run-name: Validate final benchmark fixes with verified native packages
permissions:
  contents: read
  actions: read
env:
  BEFORE_COMMIT: microsoft/vscode@8fb60541db0e1a371ea40157e0f58951ae4a485d
  AFTER_COMMIT: SimonSiefke/vscode@4b0108b1be2cafeb8405a95798676ee364fd625f
  BUILD_RUN: '41720102312'
  BENCHMARK_FILTER: diff-instructions,diff-resources,e2e-explorer-context-menu-instructions,e2e-explorer-set-files-timing,e2e-search-toggle-files-instructions,e2e-panel-tabs-toggle-labels-timing,e2e-title-bar-command-center-toggle-instructions,e2e-title-bar-layout-controls-toggle-timing,e2e-debug-javascript-set-value-timing,e2e-editor-open-timing,e2e-quick-pick-toggle-css-selectors,startup-empty-warm-timing,startup-empty-warm-instructions,startup-workspace-cold-instructions
jobs:
  initialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: npm run install:ci
      - run: npm run build
      - name: Freeze final sources and two-sample inventory
        run: |
          node packages/large-benchmark/src/main.ts matrix --preset css-specific \
            --before-commit "$BEFORE_COMMIT" --after-commit "$AFTER_COMMIT" \
            --benchmark-filter "$BENCHMARK_FILTER" --samples 2 --startup-samples 2 --css-selector-samples 2 \
            --output-dir .large-manifest
      - uses: actions/upload-artifact@v7
        with:
          name: large-manifest
          path: .large-manifest/manifest.json
  validate:
    needs: initialize
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            suffix: ''
            benchmarks: diff-resources,e2e-explorer-set-files-timing,e2e-panel-tabs-toggle-labels-timing,e2e-title-bar-layout-controls-toggle-timing,e2e-debug-javascript-set-value-timing,e2e-editor-open-timing,e2e-quick-pick-toggle-css-selectors,startup-empty-warm-timing
          - arch: arm64
            runner: ubuntu-24.04-arm
            suffix: '-arm64'
            benchmarks: diff-instructions,e2e-explorer-context-menu-instructions,e2e-search-toggle-files-instructions,e2e-title-bar-command-center-toggle-instructions,startup-empty-warm-instructions,startup-workspace-cold-instructions
    env:
      BENCHMARK_IDS: ${{ matrix.benchmarks }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: npm run install:ci
      - run: npm run build
      - name: Install desktop and kernel performance tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2t64 libnss3 libgbm1 linux-tools-common linux-tools-generic
          sudo apt-get install -y "linux-tools-$(uname -r)" || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
      - uses: actions/download-artifact@v8
        with:
          name: large-manifest
          path: .large-manifest
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          name: large-build-8fb60541db0e1a371ea40157e0f58951ae4a485d${{ matrix.suffix }}
          path: .builds/before
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          name: large-build-simonsiefke-vscode-4b0108b1be2cafeb8405a95798676ee364fd625f${{ matrix.suffix }}
          path: .builds/after
      - name: Verify baseline identity, native architecture and archive checksum
        id: before
        run: node packages/large-benchmark/src/main.ts extract --input-dir .builds/before --commit "$BEFORE_COMMIT" --output-name executable
      - name: Verify candidate identity, native architecture and archive checksum
        id: after
        run: node packages/large-benchmark/src/main.ts extract --input-dir .builds/after --commit "$AFTER_COMMIT" --output-name executable
      - name: Validate frozen final harness on native paired revisions
        env:
          BEFORE_PATH: ${{ steps.before.outputs.executable }}
          AFTER_PATH: ${{ steps.after.outputs.executable }}
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1440x1000x24 -noreset' \
            node packages/large-benchmark/src/main.ts measure --manifest .large-manifest/manifest.json \
            --benchmark-id "$BENCHMARK_IDS" --before-path "$BEFORE_PATH" --after-path "$AFTER_PATH" \
            --before-commit "$BEFORE_COMMIT" --after-commit "$AFTER_COMMIT" --output-dir .large-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: large-result-validation-${{ matrix.arch }}
          path: .large-results
          include-hidden-files: true
  report:
    needs: [initialize, validate]
    if: ${{ always() && needs.initialize.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - uses: actions/download-artifact@v8
        with:
          name: large-manifest
          path: .large-manifest
      - uses: actions/download-artifact@v8
        with:
          pattern: large-result-*
          path: .large-downloads
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          pattern: large-build-status-*
          path: .large-downloads
      - name: Require complete validation coverage and preserve the report
        run: node packages/large-benchmark/src/main.ts report --manifest .large-manifest/manifest.json --input-dir .large-downloads --output-dir .large-report --require-complete true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: large-performance-report
          path: .large-report
          include-hidden-files: true
