name: Large Performance Measure

on:
  workflow_dispatch:
    inputs:
      report_run_id:
        description: Render artifacts from an existing run without building or measuring
        type: string
        default: ''
      version_range:
        description: Inclusive stable version range, e.g. 1.120.0...1.130.0 (includes patch releases); alternative to commit inputs
        type: string
        default: ''
      commits:
        description: JSON array of full SHAs or owner/vscode@SHA references in version order (2–256)
        type: string
        default: ''
      measures:
        description: Optional comma-separated groups (startup-times, startup, timing, instructions, resources, renderer, timeline, profile, memory, bundles)
        type: string
        default: ''
      before_commit:
        description: Before VS Code commit (full SHA or owner/vscode@SHA)
        required: false
        type: string
      after_commit:
        description: After VS Code commit (full SHA or owner/vscode@SHA)
        required: false
        type: string
      samples:
        description: Samples per commit per adjacent comparison (profiling and snapshots use at most five)
        type: string
        default: '37'
      benchmark_filter:
        description: Optional comma-separated benchmark IDs; empty runs the entire suite
        type: string
        default: ''
      copilot_packaging_workaround:
        description: Explicit build-only workaround for revisions that strip the built-in Copilot SDK
        type: boolean
        default: false

run-name: Large Performance ${{ (inputs.report_run_id && format('report for run {0}', inputs.report_run_id)) || inputs.version_range || (inputs.commits && 'version trend comparison') || format('{0} → {1}', inputs.before_commit, inputs.after_commit) }}

permissions:
  contents: read
  actions: read

env:
  VERSION_RANGE: ${{ inputs.version_range }}
  COMMITS: ${{ inputs.commits }}
  MEASURES: ${{ inputs.measures }}
  BEFORE_COMMIT: ${{ inputs.before_commit }}
  AFTER_COMMIT: ${{ inputs.after_commit }}
  SAMPLES: ${{ inputs.samples }}
  BENCHMARK_FILTER: ${{ inputs.benchmark_filter }}

jobs:
  initialize:
    if: ${{ inputs.report_run_id == '' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
      build_matrix: ${{ steps.manifest.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Validate inputs and generate benchmark manifest
        id: manifest
        run: |
          revisions=()
          [[ -z "$VERSION_RANGE" ]] || revisions+=(--version-range "$VERSION_RANGE")
          [[ -z "$COMMITS" ]] || revisions+=(--commits "$COMMITS")
          [[ -z "$BEFORE_COMMIT" ]] || revisions+=(--before-commit "$BEFORE_COMMIT")
          [[ -z "$AFTER_COMMIT" ]] || revisions+=(--after-commit "$AFTER_COMMIT")
          node packages/large-benchmark/src/main.ts matrix "${revisions[@]}" \
            --samples "$SAMPLES" --benchmark-filter "$BENCHMARK_FILTER" --measures "$MEASURES" \
            --output-dir .large-manifest
      - uses: actions/upload-artifact@v7
        with:
          name: large-manifest
          path: .large-manifest/manifest.json
          retention-days: 30

  build:
    if: ${{ inputs.report_run_id == '' }}
    needs: initialize
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.build_matrix) }}
    env:
      COMMIT: ${{ matrix.commit }}
      VSCODE_BENCHMARK_COPILOT_PACKAGING_WORKAROUND: ${{ inputs.copilot_packaging_workaround }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev pkg-config xvfb x11-xserver-utils
      - name: Install harness
        run: npm run install:ci
      - name: Build harness
        run: npm run build
      - name: Build and archive the minified VS Code package
        run: |
          node packages/large-benchmark/src/main.ts prepare \
            --commit "$COMMIT" --output-dir .large-build
      - name: Upload executable package
        uses: actions/upload-artifact@v7
        with:
          name: large-build-${{ matrix.artifact }}
          path: |
            .large-build/vscode.tar.gz
            .large-build/build.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true
      - name: Upload build status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: large-build-status-${{ matrix.artifact }}
          path: .large-build/status.json
          retention-days: 30
          overwrite: true

  measure:
    needs: [initialize, build]
    if: ${{ always() && inputs.report_run_id == '' && needs.initialize.result == 'success' && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.matrix) }}
    env:
      BENCHMARK_IDS: ${{ matrix.benchmarks }}
      BEFORE_COMMIT: ${{ matrix.before }}
      AFTER_COMMIT: ${{ matrix.after }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install runner dependencies
        run: npm run install:ci
      - name: Build shared scenario utilities
        run: npm run build
      - name: Install desktop and performance tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2t64 libnss3 libgbm1 linux-tools-common linux-tools-generic
          sudo apt-get install -y "linux-tools-$(uname -r)" || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
      - uses: actions/download-artifact@v8
        with:
          name: large-build-${{ matrix.beforeArtifact }}
          path: .large-builds/before
      - uses: actions/download-artifact@v8
        with:
          name: large-build-${{ matrix.afterArtifact }}
          path: .large-builds/after
      - name: Verify and extract before build
        id: before
        run: node packages/large-benchmark/src/main.ts extract --input-dir .large-builds/before --commit "$BEFORE_COMMIT" --output-name executable
      - name: Verify and extract after build
        id: after
        run: node packages/large-benchmark/src/main.ts extract --input-dir .large-builds/after --commit "$AFTER_COMMIT" --output-name executable
      - name: Measure paired revisions
        timeout-minutes: 310
        env:
          BEFORE_PATH: ${{ steps.before.outputs.executable }}
          AFTER_PATH: ${{ steps.after.outputs.executable }}
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1440x1000x24' \
            node packages/large-benchmark/src/main.ts measure \
            --benchmark-id "$BENCHMARK_IDS" --samples "$SAMPLES" \
            --before-path "$BEFORE_PATH" --after-path "$AFTER_PATH" \
            --before-commit "$BEFORE_COMMIT" --after-commit "$AFTER_COMMIT" \
            --output-dir .large-results
      - name: Upload all available samples and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: large-result-${{ matrix.id }}-${{ matrix.group }}
          path: .large-results
          include-hidden-files: true
          retention-days: 30
          overwrite: true

  report:
    needs: [initialize, build, measure]
    if: ${{ always() && (needs.initialize.result == 'success' || inputs.report_run_id != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REPORT_RUN_ID: ${{ inputs.report_run_id || github.run_id }}
    steps:
      - name: Validate source run ID
        run: |
          if [[ ! "$REPORT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'report_run_id must be numeric' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: large-manifest
          path: .large-manifest
          run-id: ${{ inputs.report_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download raw result artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: large-result-*
          path: .large-downloads
          run-id: ${{ inputs.report_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download build status artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: large-build-status-*
          path: .large-downloads
          run-id: ${{ inputs.report_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Generate comparison charts and offline report
        run: |
          mkdir -p .large-downloads
          node packages/large-benchmark/src/main.ts report \
            --manifest .large-manifest/manifest.json --input-dir .large-downloads \
            --output-dir .large-report
      - name: Upload HTML report and charts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: large-performance-report
          include-hidden-files: true
          path: |
            .large-report/**/*.html
            .large-report/**/*.svg
          if-no-files-found: error
          retention-days: 30
          overwrite: true
