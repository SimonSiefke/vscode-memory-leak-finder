name: Paired IPC Smoke Performance

on:
  workflow_dispatch:
    inputs:
      before_commit:
        description: Baseline VS Code owner/vscode@SHA; its archived build is reused
        required: true
        type: string
      after_commit:
        description: Candidate VS Code owner/vscode@SHA to build
        required: true
        type: string
      baseline_run_id:
        description: Successful build run containing the baseline package and shared smoke harness
        required: true
        type: string
      baseline_artifact_name:
        description: Optional baseline artifact override, for reusing a prior paired candidate build
        type: string
        default: ''
      harness_run_id:
        description: Optional separate run containing the unchanged shared smoke harness
        type: string
        default: ''
      candidate_run_id:
        description: Optional prior run containing paired-candidate-build; skips rebuilding
        type: string
        default: ''
      candidate_artifact_name:
        description: Optional candidate artifact override for order-balanced archived-package pairs
        type: string
        default: ''
      local_chat_readiness:
        description: Wait for explicit local chat command completion in both baseline and candidate
        type: boolean
        default: false
      samples:
        description: Complete alternating pairs of full smoke suites (1–20)
        type: string
        default: '8'

run-name: Paired IPC smoke ${{ inputs.before_commit }} → ${{ inputs.after_commit }}${{ inputs.local_chat_readiness && ' [local chat readiness]' || '' }}

permissions:
  contents: read
  actions: read

env:
  BEFORE_COMMIT: ${{ inputs.before_commit }}
  AFTER_COMMIT: ${{ inputs.after_commit }}
  SAMPLES: ${{ inputs.samples }}
  BASELINE_ARTIFACT_NAME: ${{ inputs.baseline_artifact_name }}

jobs:
  build:
    if: ${{ inputs.candidate_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install native build dependencies with bounded network waits
        run: |
          timeout 8m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout 8m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libkrb5-dev libx11-dev libxkbfile-dev pkg-config xvfb x11-xserver-utils
      - name: Install harness
        run: npm run install:ci
      - name: Build harness
        run: npm run build
      - name: Build and archive the minified candidate
        run: node packages/large-benchmark/src/main.ts prepare --commit "$AFTER_COMMIT" --output-dir .paired-build
      - name: Upload candidate package
        uses: actions/upload-artifact@v7
        with:
          name: paired-candidate-build
          path: |
            .paired-build/vscode.tar.gz
            .paired-build/build.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  measure:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Resolve baseline artifact name
        id: references
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { parseCommitReference } from './packages/large-benchmark/src/parts/CommitReference/CommitReference.ts';
          const baseline = parseCommitReference(process.env.BEFORE_COMMIT);
          parseCommitReference(process.env.AFTER_COMMIT);
          const artifact = process.env.BASELINE_ARTIFACT_NAME || `large-build-${baseline.artifact}`;
          if (!/^[a-zA-Z0-9][a-zA-Z0-9._-]*$/.test(artifact)) throw new Error('Invalid baseline artifact name');
          appendFileSync(process.env.GITHUB_OUTPUT, `baseline_artifact=${artifact}\n`);
          JS
      - name: Install desktop dependencies
        run: |
          timeout 8m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout 8m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y xvfb libasound2t64 libnss3 libgbm1 libgtk-3-0 libxkbfile1 bubblewrap socat
      - name: Download archived baseline package
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.references.outputs.baseline_artifact }}
          path: .paired-baseline
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ github.token }}
      - name: Download identical compiled smoke harness and fixture
        uses: actions/download-artifact@v8
        with:
          name: large-smoke-harness
          path: .paired-harness
          run-id: ${{ inputs.harness_run_id || inputs.baseline_run_id }}
          github-token: ${{ github.token }}
      - name: Download candidate package
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.candidate_artifact_name || 'paired-candidate-build' }}
          path: .paired-candidate
          run-id: ${{ inputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify and extract baseline package
        id: baseline
        run: node packages/large-benchmark/src/main.ts extract --input-dir .paired-baseline --commit "$BEFORE_COMMIT" --output-name executable
      - name: Verify and extract candidate package
        id: candidate
        run: node packages/large-benchmark/src/main.ts extract --input-dir .paired-candidate --commit "$AFTER_COMMIT" --output-name executable
      - name: Verify and extract shared smoke harness
        run: node packages/large-benchmark/src/main.ts extract-smoke --input-dir .paired-harness
      - name: Apply identical local chat command readiness correction
        if: ${{ inputs.local_chat_readiness }}
        run: python3 scripts/patch-local-chat-readiness.py "$PWD/.paired-harness"
      - name: Run full smoke suites in alternating pairs on this runner
        env:
          BEFORE_PATH: ${{ steps.baseline.outputs.executable }}
          AFTER_PATH: ${{ steps.candidate.outputs.executable }}
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1440x1000x24' \
            node packages/large-benchmark/src/main.ts paired-smoke \
            --before-commit "$BEFORE_COMMIT" --after-commit "$AFTER_COMMIT" \
            --before-path "$BEFORE_PATH" --after-path "$AFTER_PATH" \
            --harness-path "$PWD/.paired-harness" --samples "$SAMPLES" \
            --output-dir .paired-results
      - name: Record optional harness correction
        if: ${{ always() && inputs.local_chat_readiness }}
        run: |
          mkdir -p .paired-results
          cp .paired-harness/local-chat-readiness-patch.json .paired-results/
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';
          const reportPath = '.paired-results/paired-smoke-result.json';
          if (existsSync(reportPath)) {
            const report = JSON.parse(readFileSync(reportPath, 'utf8'));
            report.harnessReadinessPatch = JSON.parse(readFileSync('.paired-harness/local-chat-readiness-patch.json', 'utf8'));
            writeFileSync(reportPath, JSON.stringify(report, null, 2) + '\n');
          }
          JS
      - name: Upload every attempt, paired statistics and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-smoke-results
          path: .paired-results
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
