name: Large Performance Measure

on:
  push:
    branches: [validation/large-performance-pr-3391-fixes]
  workflow_dispatch:
    inputs:
      before_commit:
        description: Before VS Code commit (full 40-character SHA)
        required: true
        type: string
      after_commit:
        description: After VS Code commit (full 40-character SHA)
        required: true
        type: string
      samples:
        description: Samples per commit (profiling and snapshots use at most five)
        type: string
        default: '37'
      benchmark_filter:
        description: Optional comma-separated benchmark IDs; empty runs the entire suite
        type: string
        default: ''

run-name: Large Performance ${{ inputs.before_commit || '07f806f999227108933c2e30515b26eecc1fda74' }} → ${{ inputs.after_commit || '07f806f999227108933c2e30515b26eecc1fda74' }}

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN: 38534632178
  BEFORE_COMMIT: ${{ inputs.before_commit || '07f806f999227108933c2e30515b26eecc1fda74' }}
  AFTER_COMMIT: ${{ inputs.after_commit || '07f806f999227108933c2e30515b26eecc1fda74' }}
  SAMPLES: ${{ inputs.samples || '37' }}
  BENCHMARK_FILTER: ${{ inputs.benchmark_filter || 'startup-empty-cold-resources,startup-empty-warm-resources,startup-workspace-cold-resources,startup-workspace-warm-resources,open-small-resources,open-large-resources,type-resources,scroll-timing,scroll-instructions,scroll-resources,scroll-timeline,scroll-memory,scroll-renderer,scroll-profile,find-resources,search-resources,quick-open-resources,explorer-resources,diff-resources,terminal-create-resources,terminal-command-resources,settings-resources' }}

jobs:
  initialize:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Validate inputs and generate benchmark manifest
        id: manifest
        run: |
          node packages/large-benchmark/src/main.ts matrix \
            --before-commit "$BEFORE_COMMIT" --after-commit "$AFTER_COMMIT" \
            --samples "$SAMPLES" --benchmark-filter "$BENCHMARK_FILTER" \
            --output-dir .large-manifest
      - uses: actions/upload-artifact@v7
        with:
          name: large-manifest
          path: .large-manifest/manifest.json
          retention-days: 30

  build:
    needs: initialize
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        revision: [before, after]
    env:
      REVISION: ${{ matrix.revision }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Reuse the packaged revision from the full validation run
        uses: actions/download-artifact@v8
        with:
          name: large-build-${{ matrix.revision }}
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: .large-build
      - name: Verify the reused build and retain its metadata
        run: |
          if [[ "$REVISION" == before ]]; then
            commit="$BEFORE_COMMIT"
          else
            commit="$AFTER_COMMIT"
          fi
          node packages/large-benchmark/src/main.ts extract --input-dir .large-build --commit "$commit" --output-name executable
          node --input-type=module -e "import {readFileSync,writeFileSync} from 'node:fs'; const metadata=JSON.parse(readFileSync('.large-build/build.json','utf8')); writeFileSync('.large-build/status.json',JSON.stringify({...metadata,status:'success',sourceRun:process.env.SOURCE_RUN},null,2))"
      - name: Upload executable package
        uses: actions/upload-artifact@v7
        with:
          name: large-build-${{ matrix.revision }}
          path: |
            .large-build/vscode.tar.gz
            .large-build/build.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true
      - name: Upload build status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: large-build-status-${{ matrix.revision }}
          path: .large-build/status.json
          retention-days: 30
          overwrite: true

  measure:
    needs: [initialize, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.matrix) }}
    env:
      BENCHMARK_ID: ${{ matrix.id }}
      JOB_SAMPLES: ${{ matrix.samples }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install runner dependencies
        run: npm run install:ci
      - name: Build shared scenario utilities
        run: npm run build
      - name: Install desktop and performance tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2t64 libnss3 libgbm1 linux-tools-common linux-tools-generic
          sudo apt-get install -y "linux-tools-$(uname -r)" || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
      - uses: actions/download-artifact@v8
        with:
          name: large-build-before
          path: .large-builds/before
      - uses: actions/download-artifact@v8
        with:
          name: large-build-after
          path: .large-builds/after
      - name: Verify and extract before build
        id: before
        run: node packages/large-benchmark/src/main.ts extract --input-dir .large-builds/before --commit "$BEFORE_COMMIT" --output-name executable
      - name: Verify and extract after build
        id: after
        run: node packages/large-benchmark/src/main.ts extract --input-dir .large-builds/after --commit "$AFTER_COMMIT" --output-name executable
      - name: Measure paired revisions
        timeout-minutes: 310
        env:
          BEFORE_PATH: ${{ steps.before.outputs.executable }}
          AFTER_PATH: ${{ steps.after.outputs.executable }}
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1440x1000x24' \
            node packages/large-benchmark/src/main.ts measure \
            --benchmark-id "$BENCHMARK_ID" --samples "$JOB_SAMPLES" \
            --before-path "$BEFORE_PATH" --after-path "$AFTER_PATH" \
            --before-commit "$BEFORE_COMMIT" --after-commit "$AFTER_COMMIT" \
            --output-dir .large-results
      - name: Upload all available samples and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: large-result-${{ matrix.id }}
          path: .large-results
          include-hidden-files: true
          retention-days: 30
          overwrite: true

  report:
    needs: [initialize, build, measure]
    if: ${{ always() && needs.initialize.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: large-manifest
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: .large-manifest
      - name: Download the original full-suite results
        uses: actions/download-artifact@v8
        with:
          pattern: large-result-*
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: .large-downloads
      - name: Preserve superseded results separately from the new comparison
        run: |
          python3 - <<'PYTHON'
          import json, shutil
          from pathlib import Path
          manifest=json.loads(Path('.large-manifest/manifest.json').read_text())
          changed=[b['id'] for b in manifest['benchmarks'] if b['collector']=='resources' or b['scenario']=='scroll']
          destination=Path('.large-original-affected')
          destination.mkdir()
          for benchmark in changed:
              source=Path('.large-downloads')/('large-result-'+benchmark)
              if source.exists(): shutil.move(str(source),destination/source.name)
          PYTHON
      - name: Download raw result artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: large-result-*
          path: .large-downloads
      - name: Download build status artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: large-build-status-*
          path: .large-downloads
      - name: Generate comparison charts and offline report
        env:
          BUILD_OUTCOMES: ${{ needs.build.result == 'success' && 'success,success' || 'failure,failure' }}
        run: |
          mkdir -p .large-downloads
          node packages/large-benchmark/src/main.ts report \
            --manifest .large-manifest/manifest.json --input-dir .large-downloads \
            --output-dir .large-report --build-outcomes "$BUILD_OUTCOMES"
      - name: Include the initial results and explain the validation sources
        if: always()
        run: |
          mkdir -p .large-report/validation
          mv .large-original-affected .large-report/validation/original-affected
          cat > .large-report/validation/README.txt <<'VALIDATION'
          The original full suite ran in https://github.com/SimonSiefke/vscode-memory-leak-finder/actions/runs/38534632178.
          This follow-up reuses those same two packaged VS Code builds.
          All resource benchmarks and scroll workloads were measured again after fixes to CPU time units, independent PSS collection, and native keyboard scrolling.
          The comparison report uses those new results and the unchanged benchmarks from the original full suite.
          Superseded raw results are retained under validation/original-affected; they do not contribute to the new comparison statistics.
          VALIDATION
      - name: Upload comparison report and raw evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: large-performance-report
          path: .large-report
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          overwrite: true
