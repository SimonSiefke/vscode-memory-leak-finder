name: Terminal PoolMon investigation

on:
  push:
    branches:
      - diagnostic/poolmon-terminal
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [comparison, heap, poolmon, video]
        default: comparison

permissions:
  contents: read

concurrency:
  group: poolmon-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run install:ci
      - run: npm run build
      - name: Install archive tool for controlled dependency patch
        run: npm install --prefix .tmp/asar-tools --no-save --package-lock=false --ignore-scripts @electron/asar@4.3.0
      - name: Test dependency archive patch
        run: node --test scripts/patch-conpty-archive.test.ts
      - name: Locate PoolMon
        shell: pwsh
        run: |
          $poolmon = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Tools" -Recurse -Filter poolmon.exe -File |
            Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if ($null -eq $poolmon) { throw 'x64 PoolMon was not found' }
          "POOLMON_PATH=$($poolmon.FullName)" >> $env:GITHUB_ENV
      - name: Measure Terminal with fresh profiles
        env:
          TERMINAL_DIAGNOSTIC_MODE: ${{ inputs.mode || 'comparison' }}
          POOLMON_IDLE_SECONDS: 5,30,60
        run: node scripts/poolmon-terminal.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: poolmon-terminal-evidence
          path: .tmp/poolmon-terminal
          include-hidden-files: true
          if-no-files-found: error
