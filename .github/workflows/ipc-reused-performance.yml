name: IPC Reused Package Performance

on:
  workflow_dispatch:
    inputs:
      before_commit:
        description: Exact before owner/vscode@SHA matching the archived package
        required: true
        type: string
      after_commit:
        description: Exact after owner/vscode@SHA matching the archived package
        required: true
        type: string
      build_run_id:
        description: Successful build workflow run in this repository containing both packages
        required: true
        type: string
      before_artifact:
        description: Full baseline large-build artifact name
        required: true
        type: string
      after_artifact:
        description: Full candidate large-build artifact name
        required: true
        type: string
      benchmark_ids:
        description: Comma-separated existing large-performance benchmark IDs
        required: true
        type: string
        default: startup-workspace-warm-instructions,open-large-instructions,terminal-create-instructions,open-large-profile,terminal-create-profile
      samples:
        description: Independent paired samples; diagnostic profiles are capped at five
        type: string
        default: '50'

permissions:
  contents: read
  actions: read

env:
  BEFORE_COMMIT: ${{ inputs.before_commit }}
  AFTER_COMMIT: ${{ inputs.after_commit }}
  SAMPLES: ${{ inputs.samples }}

jobs:
  initialize:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Validate exact revisions and benchmark selection
        id: manifest
        env:
          BENCHMARK_IDS: ${{ inputs.benchmark_ids }}
        run: |
          node packages/large-benchmark/src/main.ts matrix \
            --before-commit "$BEFORE_COMMIT" --after-commit "$AFTER_COMMIT" \
            --samples "$SAMPLES" --benchmark-filter "$BENCHMARK_IDS" \
            --output-dir .large-manifest
      - uses: actions/upload-artifact@v7
        with:
          name: large-manifest
          path: .large-manifest/manifest.json
          retention-days: 30

  measure:
    needs: initialize
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.matrix) }}
    env:
      BENCHMARK_IDS: ${{ matrix.benchmarks }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install runner dependencies
        run: npm run install:ci
      - name: Build shared scenario utilities
        run: npm run build
      - name: Install desktop and performance tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2t64 libnss3 libgbm1 linux-tools-common linux-tools-generic
          sudo apt-get install -y "linux-tools-$(uname -r)" || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.before_artifact }}
          path: .large-builds/before
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.after_artifact }}
          path: .large-builds/after
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify and extract before build
        id: before
        run: node packages/large-benchmark/src/main.ts extract --input-dir .large-builds/before --commit "$BEFORE_COMMIT" --output-name executable
      - name: Verify and extract after build
        id: after
        run: node packages/large-benchmark/src/main.ts extract --input-dir .large-builds/after --commit "$AFTER_COMMIT" --output-name executable
      - name: Measure paired revisions
        timeout-minutes: 310
        env:
          BEFORE_PATH: ${{ steps.before.outputs.executable }}
          AFTER_PATH: ${{ steps.after.outputs.executable }}
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1440x1000x24' \
            node packages/large-benchmark/src/main.ts measure \
            --benchmark-id "$BENCHMARK_IDS" --samples "$SAMPLES" \
            --before-path "$BEFORE_PATH" --after-path "$AFTER_PATH" \
            --before-commit "$BEFORE_COMMIT" --after-commit "$AFTER_COMMIT" \
            --output-dir .large-results
      - name: Upload all available samples and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: large-result-${{ matrix.id }}-${{ matrix.group }}
          path: .large-results
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  report:
    needs: [initialize, measure]
    if: ${{ always() && needs.initialize.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: large-manifest
          path: .large-manifest
      - name: Download available raw measurements
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: large-result-*
          path: .large-downloads
      - name: Download original build status
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: large-build-status-*
          path: .large-downloads
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Generate report
        run: |
          mkdir -p .large-downloads
          node packages/large-benchmark/src/main.ts report \
            --manifest .large-manifest/manifest.json --input-dir .large-downloads \
            --output-dir .large-report
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: large-performance-report
          path: .large-report
          retention-days: 30
