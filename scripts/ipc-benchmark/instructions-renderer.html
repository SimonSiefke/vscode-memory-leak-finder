<!doctype html>
<script type="module">
  import { run } from './instructions-renderer.mjs'
  window.addEventListener('message', async (event) => {
    if (event.data.event !== 'benchmark-start') return
    try {
      window.reportBenchmark(await run(event.data.options, event.ports[0], event.data.identifier))
    } catch (error) {
      window.reportBenchmark({ error: String(error.stack) })
    }
  })
</script>
